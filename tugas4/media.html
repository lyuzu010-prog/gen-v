<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Media & Layout</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">
    
    <style>
        /* Reset dasar & pengaturan halaman */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10; /* Hitam pekat */
            /* Efek jaring/grid halus & cahaya merah-biru khas Spider-Man di background */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(226, 54, 54, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(1, 104, 217, 0.25) 0%, transparent 45%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 20px);
            background-attachment: fixed;
            color: #ffffff;
            padding: 40px 20px;
        }

        /* Header / Judul Utama Bertema Spider-Man */
        .spidey-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .spidey-logo {
            width: 65px;
            height: 65px;
            fill: #e23636;
            filter: drop-shadow(0 0 10px rgba(226, 54, 54, 0.8));
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .spidey-logo:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .spidey-header h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #e23636, -2px -2px 0px #0168d9;
        }

        /* Container utama untuk menyusun elemen ke bawah */
        .media-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* Card / Kotak pembungkus setiap media (Hitam & Merah Spider-Man) */
        .media-item {
            background: #14161d; /* Hitam keabu-abuan gelap */
            padding: 25px;
            border-radius: 14px;
            border: 2px solid #e23636; /* Garis tepi merah Spider-Man */
            box-shadow: 0 8px 25px rgba(226, 54, 54, 0.2), inset 0 0 15px rgba(1, 104, 217, 0.15);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        /* Efek menyala saat kursor diarahkan ke kotak */
        .media-item:hover {
            transform: translateY(-4px);
            border-color: #ff4747;
            box-shadow: 0 12px 30px rgba(226, 54, 54, 0.4), 0 0 15px rgba(1, 104, 217, 0.4);
        }

        /* Judul di setiap kotak media */
        .media-item h3 {
            margin-bottom: 18px;
            font-size: 19px;
            color: #ffffff;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid #e23636;
            padding-left: 12px;
        }

        /* Pengaturan agar media responsif */
        img, video, iframe {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #2b2f3c;
        }

        img {
            height: auto;
            object-fit: cover;
        }

        audio {
            width: 100%;
            max-width: 600px;
        }

        iframe {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Header Spider-Man -->
    <div class="spidey-header">
        <!-- Ikon Laba-laba (SVG) -->
        <svg class="spidey-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 9c-1.1 0-2 .9-2 2v1c0 1.66 1.34 3 3 3s3-1.34 3-3v-1c0-1.1-.9-2-2-2h-2zm0-3c.83 0 1.5.67 1.5 1.5S12.83 9 12 9s-1.5-.67-1.5-1.5S11.17 6 12 6zm-3.5 4.5L4 7 2.5 8.5l4.2 3.3L3 14.5 4 16l4.5-3.2v1.4L4.5 19 6 20.5l3.8-4.5c.6.6 1.4 1 2.2 1s1.6-.4 2.2-1l3.8 4.5L19.5 19l-4-4.8v-1.4L20 16l1-1.5-3.7-2.7 4.2-3.3L20 7l-4.5 3.5h-7z"/>
        </svg>
        <h1>Spider-Media</h1>
    </div>

    <div class="media-container">
        
        <!-- 1. Gambar -->
        <div class="media-item">
            <h3>🕸️ Gambar</h3>
            <img src="assets/img1.jpg" alt="gambar1" width="600" height="400">
        </div>
        
        <!-- 2. Tag Audio -->
        <div class="media-item">
            <h3>🕷️ Audio</h3>
            <audio controls>
                <source src="assets/audio1.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung tag audio.
            </audio>
        </div>
         
        <!-- 3. Tag Video -->
        <div class="media-item">
            <h3>🕸️ Video Lokal</h3>
            <video controls width="600">
                <source src="assets/video1.mp4" type="video/mp4">
                Browser Anda tidak mendukung tag video.
            </video>
        </div>

        <!-- 4. Tag Embed / Iframe YouTube -->
        <div class="media-item">
            <h3>🕷️ Video YouTube</h3>
            <iframe 
                src="https://www.youtube.com/embed/VANls_LF2_0?si=o7A-MI2ODSczZhhN" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>

    </div>

</body>
</html>
